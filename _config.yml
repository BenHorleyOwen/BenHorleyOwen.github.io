title: "Ben Horley-Owen"
description: "Security Engineer | DevSecOps Engineer | Infrastructure Security | Security Operations Engineer | DFIR Analyst"
baseurl: ""
url: "https://github.com/BenHorleyOwen"

# Style theme: name of a file in the style guide repo's _data/themes/ (no .yml)
# Options: dark-editorial (your original look), matchbox
style_theme: dark-editorial

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - .style-guide
