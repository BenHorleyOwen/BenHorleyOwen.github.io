  Outside of work I also have a passion for creating anything that interests me. This includes a home-lab where I deploy my own reciple manager and music server (which Ive made a template for quick deployment) which I extended with a kareoke interface; all so I could turn anyones laptop at a party into a quick kareoke machine which can find and serve almost any song.  
  This all led to me teaching myself the aspects of devops and led me to where I am today. 

