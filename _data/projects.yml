      a fun, small, subproject to control my computer across my room

  - name: Portfolio Website
    type: [presentation]
    repo: https://github.com/BenHorleyOwen/BenHorleyOwen.github.io
    skills: [automation, github actions, frontend, development, javascript, file handling, scripting, organisational skills, ruby]
    description: |
      The Portfolio web-page, deployed with github pages and locally tested with one of my [Compose Templates](https://github.com/BenHorleyOwen/Compose-Templates)
      - "Projects" section is automatically generated from my personal notes when I [push them from my personal notes](https://github.com/BenHorleyOwen/Automated-portfolio-deployment).

  - name: Automated Portfolio Deployment
    type: [presentation]
    repo: https://github.com/BenHorleyOwen/Automated-portfolio-deployment
    skills: [version control, automation, file handling, organisational skills, oop, ci/cd, oauth, resuable workflows, scripting, python]
    description: |
      The goal of this project is to automatically maintain all my public project information easily when I backup my collection of notes. 
      Project information and indexes containing subprojects can both be displayed, as well as an abstract structure made with OOP to allow for future customisable tagged sections.

  - name: incremental journal backup
    type: [presentation]
    repo: https://github.com/BenHorleyOwen/Incremental-Journal-Backup
    skills: [apis, backups, automation, scripting]
    description: |
      modified a tool which takes full backups of the service I use for journaling and instead made it work by taking partial backups and updating the previously created HTML documents. The modified tool uses the API put up by the service to take the last entry ID when run

  - name: Leetcode Automation
    type: [presentation]
    repo: https://github.com/BenHorleyOwen/Leetcode-Synchroniser
    skills: [apis, backups, automation, scripting]
    description: |
      This is an implementation of a GitHub action written by dos-m0nk3y to collect leetcode submissions, using a modified version by HoneyHabib for language support.
      The automation is used to gather the leetcode challenges I have completed with the accepted submission.

  - name: Compose Files
    type: [index]
    repo: https://github.com/BenHorleyOwen/Compose-Templates
    skills: [github, submodules, templates, organisation, ci/cd, actions]
    description: |
      this is an index of compose stacks that I have either set up as templates or for quick deploy across my devices. 
      Contains a workflow to automatically hyperlink the submodules and any future additions.

    subprojects: [API Template, Node Template, Jekyll Host, Database Node]
  - name: API Template
    type: [subproject]
    repo: https://github.com/BenHorleyOwen/API-template
    skills: [docker, python, fastapi, networking]
    description: |
      This project is a quick compose file made during a hackathon to quickly initialise a database and API serving container network on the local network.

  - name: Node Template
    type: [subproject]
    repo: https://github.com/BenHorleyOwen/Node-Template
    skills: [nodejs, apis, docker, networking, sql]
    description: |
      This compose file mounts a given directory and serves it as a node js web server.

  - name: Jekyll Host
    type: [subproject]
    repo: https://github.com/BenHorleyOwen/Jekyll-Host
    skills: [jekyll, dev environment, docker, deployment]
    description: |
      This compose file builds a mounted directory and serves the webpage locally. 
      This was utilised as a local development environment while i was designing my portfolio webpage.

  - name: Database Node
    type: [subproject]
    repo: https://github.com/BenHorleyOwen/Database-Node
    skills: [nodejs, python, docker, sql, networking, frontend, backend]
    description: |
      Orchestrates a database and a website API to access it. Repo was designed with an init.sh for fast setup. This project was developed deployed as a submodule for my submission to [ETHOxford2026](https://github.com/BenHorleyOwen/ETH2026)


