<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="nav-logo">{{ site.data.info.name }}</a>
    <div class="nav-links">
      <a href="{{ site.data.info.github | prepend: 'https://github.com/' }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.data.info.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>{{ site.data.info.name }} — built with Jekyll &amp; GitHub Pages</span>
    <a href="{{ site.data.info.github | prepend: 'https://github.com/' }}" target="_blank" rel="noopener">Source ↗</a>
  </footer>

</body>
</html>
